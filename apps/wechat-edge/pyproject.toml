[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usagi-wechat-edge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
usagi-wechat-edge = "wechat_edge.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wechat_edge*"]
